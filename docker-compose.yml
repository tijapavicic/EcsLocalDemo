
# ─────────────────────────────────────────────────────────────────────────────
# ECS Local Demo — Docker Compose for local development with MinIO
#
# Usage:
#   docker compose up -d              # start everything
#   docker compose logs -f app        # follow app logs
#   docker compose down -v            # stop & remove volumes
#
# Services:
#   app     — Spring Boot app on port 8080 (profile: local-minio)
#   minio   — S3-compatible object storage on port 9000
#             MinIO Console UI on port 9001 → http://localhost:9001
#   init    — one-shot container that creates the demo-bucket
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MinIO — S3-compatible object storage ────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2023-09-30T07-02-29Z
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Init — creates the bucket on first run ───────────────────────────────────
  init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
        /usr/bin/mc mb local/demo-bucket --ignore-existing;
        echo 'Bucket demo-bucket is ready.';
        exit 0;
      "

  # ── App — Spring Boot application ───────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecs-local-demo
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local-minio
      # Override endpoint so app reaches minio by service name inside Docker network
      STORAGE_S3_ENDPOINT: http://minio:9000
    depends_on:
      minio:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  minio_data:

