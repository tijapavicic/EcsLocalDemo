# ─────────────────────────────────────────────────────────────
# Profile: local-minio
# Used for: local development with Docker Compose MinIO
# Start with: --spring.profiles.active=local-minio
# ─────────────────────────────────────────────────────────────

storage:
  s3:
    bucket: demo-bucket
    region: us-east-1
    # MinIO endpoint — when running locally (outside Docker)
    # Override via STORAGE_S3_ENDPOINT env var when running inside Docker
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin

# OpenTelemetry: Tracing configured via:
#   - Environment variables (OTEL_TRACES_EXPORTER, OTEL_EXPORTER_OTLP_ENDPOINT)
#   - Java agent: -javaagent:opentelemetry-javaagent.jar
#   (see plan.md for detailed setup instructions)

logging:
  level:
    com.example.adapters.inbound.security: DEBUG
    com.example.core.usecases: DEBUG
    org.springframework.security: DEBUG

# ╔════════════════════════════════════════════════════════════════╗
# ║ Bearer Token Authentication — Toggle for Testing              ║
# ╚════════════════════════════════════════════════════════════════╝
# To disable Bearer token auth and test without tokens:
#   mvn spring-boot:run \
#     -Dspring-boot.run.arguments="--spring.profiles.active=local-minio --app.security.bearer-token-auth-enabled=false"
app:
  security:
    # Uncomment or override to disable auth for testing
    # bearer-token-auth-enabled: false

