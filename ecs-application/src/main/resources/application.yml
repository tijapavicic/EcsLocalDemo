spring:
  application:
    name: ecs-local-demo
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 110MB

server:
  port: 8080

# Default storage config — safe fallback values.
# Override via an active profile: --spring.profiles.active=local-minio  or  aws
storage:
  s3:
    bucket: ${AWS_S3_BUCKET:demo-bucket}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${STORAGE_S3_ENDPOINT:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  # OpenTelemetry & Micrometer Configuration
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0  # Sample 100% of traces (use 0.1 for 10% in production)
    # Jaeger exporter can be configured here, or via environment variables
    # OTEL_EXPORTER_JAEGER_ENDPOINT=http://localhost:14250 (gRPC)
    # or OTEL_TRACES_EXPORTER=jaeger

logging:
  level:
    com.example: INFO
    com.example.adapters.inbound.security: DEBUG
    software.amazon.awssdk: WARN
    org.springframework.security: DEBUG

# ╔════════════════════════════════════════════════════════════════════╗
# ║ IDM (Identity & Access Management) Configuration                   ║
# ╚════════════════════════════════════════════════════════════════════╝
app:
  security:
    # Feature flag: Toggle Bearer token authentication on/off
    #
    # Options:
    #   true  (default) — Bearer token required for /api/files/** endpoints
    #   false — All requests allowed without Bearer token (testing only)
    #
    # To disable:
    #   mvn spring-boot:run -Dspring-boot.run.arguments="--app.security.bearer-token-auth-enabled=false"
    #
    # Or via environment variable:
    #   export APP_SECURITY_BEARER_TOKEN_AUTH_ENABLED=false
    #   docker run -e APP_SECURITY_BEARER_TOKEN_AUTH_ENABLED=false app
    #
    bearer-token-auth-enabled: true

    # Token format (for future JWT support)
    # Options: base64 (current demo implementation), jwt (planned)
    token-format: "base64"

