# ─────────────────────────────────────────────────────────────
# Profile: aws
# Used for: production deployment on AWS ECS
# Start with: --spring.profiles.active=aws
# Credentials should come from environment variables or IAM role
# ─────────────────────────────────────────────────────────────

storage:
  s3:
    bucket: ${AWS_S3_BUCKET:my-demo-bucket}
    region: ${AWS_REGION:eu-west-1}
    # No endpoint for real AWS — SDK resolves it automatically
    endpoint:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

# OpenTelemetry: Distributed tracing configured via environment variables
# In ECS task definition, set:
#   OTEL_TRACES_EXPORTER=otlp  (or jaeger, awsxray, etc.)
#   OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://collector:4317
# Or use OpenTelemetry Java agent for auto-instrumentation

management:
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 0.1  # Sample 10% of traces in production (reduce cost)

logging:
  level:
    com.example.adapters.inbound.security: INFO
    com.example.core.usecases: INFO

# ╔════════════════════════════════════════════════════════════════╗
# ║ Bearer Token Authentication — Production Settings             ║
# ╚════════════════════════════════════════════════════════════════╝
# In production, Bearer token auth is enabled by default
# To disable in emergency (should require approval):
#   docker run -e APP_SECURITY_BEARER_TOKEN_AUTH_ENABLED=false app
# (Requires restart — see documentation for instant toggle endpoint)
app:
  security:
    # IMPORTANT: Keep this true in production
    # Only disable if explicitly required for emergency troubleshooting
    bearer-token-auth-enabled: true

